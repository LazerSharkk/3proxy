name: build 3proxy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            artifact: 3proxy-linux-amd64
            cc: gcc
            cflags: "-O2"
            ldflags: ""

          - name: linux-386
            artifact: 3proxy-linux-386
            cc: gcc
            cflags: "-m32 -O2"
            ldflags: "-m32"

          - name: linux-arm64
            artifact: 3proxy-linux-arm64
            cc: aarch64-linux-gnu-gcc
            cflags: "-O2"
            ldflags: ""

          - name: linux-armv7
            artifact: 3proxy-linux-armv7
            cc: arm-linux-gnueabihf-gcc
            cflags: "-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -O2"
            ldflags: ""

          - name: linux-armv6
            artifact: 3proxy-linux-armv6
            cc: arm-linux-gnueabi-gcc
            cflags: "-march=armv6 -O2"
            ldflags: ""

          - name: linux-armv5
            artifact: 3proxy-linux-armv5
            cc: arm-linux-gnueabi-gcc
            cflags: "-march=armv5te -Os"
            ldflags: ""

          - name: linux-mips
            artifact: 3proxy-linux-mips
            cc: mips-linux-gnu-gcc-10
            cflags: "-O2"
            ldflags: ""

          - name: linux-mipsel
            artifact: 3proxy-linux-mipsel
            cc: mipsel-linux-gnu-gcc-10
            cflags: "-O2"
            ldflags: ""

          - name: linux-ppc
            artifact: 3proxy-linux-ppc
            cc: powerpc-linux-gnu-gcc
            cflags: "-O2"
            ldflags: ""

          - name: linux-ppc64
            artifact: 3proxy-linux-ppc64
            cc: powerpc64-linux-gnu-gcc
            cflags: "-O2"
            ldflags: ""

          - name: linux-ppc64le
            artifact: 3proxy-linux-ppc64le
            cc: powerpc64le-linux-gnu-gcc
            cflags: "-O2"
            ldflags: ""

          - name: linux-riscv64
            artifact: 3proxy-linux-riscv64
            cc: riscv64-linux-gnu-gcc
            cflags: "-O2"
            ldflags: ""

          - name: linux-armv5-linux26-glibc25
            artifact: 3proxy-linux-armv5-linux26-glibc25
            legacy: true

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install modern toolchain
        if: matrix.legacy != true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          case "${{ matrix.name }}" in
            linux-amd64)
              sudo apt-get install -y gcc
              ;;
            linux-386)
              sudo apt-get install -y gcc gcc-multilib
              ;;
            linux-arm64)
              sudo apt-get install -y gcc-aarch64-linux-gnu
              ;;
            linux-armv7)
              sudo apt-get install -y gcc-arm-linux-gnueabihf
              ;;
            linux-armv6|linux-armv5)
              sudo apt-get install -y gcc-arm-linux-gnueabi
              ;;
            linux-mips)
              sudo apt-get install -y gcc-10-mips-linux-gnu
              ;;
            linux-mipsel)
              sudo apt-get install -y gcc-10-mipsel-linux-gnu
              ;;
            linux-ppc)
              sudo apt-get install -y gcc-powerpc-linux-gnu
              ;;
            linux-ppc64)
              sudo apt-get install -y gcc-powerpc64-linux-gnu
              ;;
            linux-ppc64le)
              sudo apt-get install -y gcc-powerpc64le-linux-gnu
              ;;
            linux-riscv64)
              sudo apt-get install -y gcc-riscv64-linux-gnu
              ;;
          esac
          command -v "${{ matrix.cc }}"

      - name: test legacy toolchain url
        if: matrix.legacy == true
        run: |
          curl -IL \
            --retry 3 \
            --retry-all-errors \
            "https://github.com/LazerSharkk/toolchains/releases/download/arm-2008q3-72/arm-2008q3-72-arm-none-linux-gnueabi-i686-pc-linux-gnu.tar.bz2"

      - name: download legacy armv5 toolchain
        if: matrix.legacy == true
        run: |
          mkdir -p "$HOME/toolchain"
          curl -fL \
            --retry 5 \
            --retry-all-errors \
            "https://github.com/LazerSharkk/toolchains/releases/download/arm-2008q3-72/arm-2008q3-72-arm-none-linux-gnueabi-i686-pc-linux-gnu.tar.bz2" \
            -o /tmp/toolchain.tar.bz2
          ls -lh /tmp/toolchain.tar.bz2
          file /tmp/toolchain.tar.bz2
          tar -xjf /tmp/toolchain.tar.bz2 \
            -C "$HOME/toolchain"
          find "$HOME/toolchain" \
            -name arm-none-linux-gnueabi-gcc \
            -type f \
            -print

      - name: install legacy toolchain runtime
        if: matrix.legacy == true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            libc6:i386 \
            libstdc++6:i386

      - name: build modern target
        if: matrix.legacy != true
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: ${{ matrix.cflags }}
          LDFLAGS: ${{ matrix.ldflags }}
        run: |
          mkdir -p bin dist
          make -f Makefile.Linux clean || true
          make -f Makefile.Linux \
            CC="$CC" \
            LN="$CC" \
            EXTRA_CFLAGS="$CFLAGS" \
            EXTRA_LDFLAGS="$LDFLAGS"

          cp bin/3proxy "dist/${{ matrix.artifact }}"

          # Use target-specific strip tool if present, otherwise fallback to system strip
          strip_tool="${CC%-10}"
          strip_tool="${strip_tool%gcc}strip"
          "$strip_tool" "dist/${{ matrix.artifact }}" 2>/dev/null || strip "dist/${{ matrix.artifact }}" || true

      - name: build legacy armv5 target
        if: matrix.legacy == true
        run: |
          toolchain="$HOME/toolchain/arm-2008q3"
          cc="$toolchain/bin/arm-none-linux-gnueabi-gcc"
          strip_tool="$toolchain/bin/arm-none-linux-gnueabi-strip"
          "$cc" --version

          mkdir -p bin dist
          make -f Makefile.Linux clean || true

          # GCC 4.3.2 predates LTO support (introduced in GCC 4.5), so remove -flto
          sed -i 's/-flto//g' Makefile.Linux

          # glibc 2.5 lacks setns() (added in glibc 2.14 / Linux 3.0+).
          # Append a fallback stub returning ENOSYS.
          cat << 'EOF' >> src/common.c
          #include <errno.h>
          int setns(int fd, int nstype) {
              errno = ENOSYS;
              return -1;
          }
          EOF

          make -f Makefile.Linux \
            CC="$cc" \
            LN="$cc" \
            STATIC=true \
            EXTRA_CFLAGS="-march=armv5te -Os" \
            EXTRA_LDFLAGS="-static"

          cp bin/3proxy "dist/${{ matrix.artifact }}"
          "$strip_tool" "dist/${{ matrix.artifact }}" || true

      - name: inspect binary
        run: |
          file "dist/${{ matrix.artifact }}"

      - name: calculate sha256
        run: |
          cd dist
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    name: create release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: flatten release directory
        run: |
          mkdir -p release-files
          find release \
            -type f \
            -exec cp {} release-files/ \;
          cd release-files
          ls -lah

      - name: generate manifest
        run: |
          cd release-files
          echo '{' > manifest.json
          first=true
          for file in 3proxy-*; do
            case "$file" in
              *.sha256)
                continue
                ;;
            esac
            sha256=$(sha256sum "$file" | awk '{print $1}')
            if [ "$first" = false ]; then
              echo "," >> manifest.json
            fi
            first=false
            printf '  "%s": "%s"' \
              "$file" \
              "$sha256" \
              >> manifest.json
          done
          echo '' >> manifest.json
          echo '}' >> manifest.json
          cat manifest.json

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release-files/*
          generate_release_notes: true
