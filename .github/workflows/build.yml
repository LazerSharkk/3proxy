name: build 3proxy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TOOLCHAIN_REPO: "LazerSharkk/bootlin"
  TOOLCHAIN_TAG: "stable-2024.05-1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            artifact: 3proxy-linux-amd64
            tarball: x86-64--musl--stable-2024.05-1.tar.xz
            sha256: f3cf417d28e7df95bdab632ff837de66ac03145bd0e1dd78cc89aadfa6e31526
            prefix: x86_64-buildroot-linux-musl-
            cflags: "-O2"

          - name: linux-386
            artifact: 3proxy-linux-386
            tarball: x86-i686--uclibc--stable-2024.05-1.tar.xz
            sha256: e240d983717e03a8ea7c5ffba71077b555f05f40694f177e23756d2a47656599
            prefix: i686-buildroot-linux-uclibc-
            cflags: "-O2"

          - name: linux-arm64
            artifact: 3proxy-linux-arm64
            tarball: aarch64--musl--stable-2024.05-1.tar.xz
            sha256: f847da1195325525f3f07eef045ef40c6b48464a37e0f7fea77360dfe0bc1aa1
            prefix: aarch64-buildroot-linux-musl-
            cflags: "-O2"

          - name: linux-armv7
            artifact: 3proxy-linux-armv7
            tarball: armv7-eabihf--uclibc--stable-2024.05-1.tar.xz
            sha256: eec6e21cf9d36ab2e8b9dbf4e26311d3d152927c72550bfe84872858e63bcaf4
            prefix: arm-buildroot-linux-uclibcgnueabihf-
            cflags: "-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -O2"

          - name: linux-armv6
            artifact: 3proxy-linux-armv6
            tarball: armv6-eabihf--uclibc--stable-2024.05-1.tar.xz
            sha256: 38e3c482368c96f177c164ed098e7022f45adf83d8715cb2f74238a5a7c0622d
            prefix: arm-buildroot-linux-uclibcgnueabihf-
            cflags: "-march=armv6 -O2"

          - name: linux-armv5
            artifact: 3proxy-linux-armv5
            tarball: armv5-eabi--uclibc--stable-2024.05-1.tar.xz
            sha256: c0c616d4f7d6702b8991f83a5a3777137f734e1eb610d4a20297eaef299ec59d
            prefix: arm-buildroot-linux-uclibcgnueabi-
            cflags: "-march=armv5te -Os"

          - name: linux-arc700
            artifact: 3proxy-linux-arc700
            tarball: arcle-750d--uclibc--stable-2024.05-1.tar.xz
            sha256: 74b2afe4f915708e81d9b595396ff82fbc841f698a0b78d778a52cf7be668081
            prefix: arc-buildroot-linux-uclibc-
            cflags: "-mcpu=arc700 -Os"

          - name: linux-mips
            artifact: 3proxy-linux-mips
            tarball: mips32--uclibc--stable-2024.05-1.tar.xz
            sha256: 52ed979092edad8100bc0275426e7eccadefa68b908ac35d18d29c385b30e12d
            prefix: mips-buildroot-linux-uclibc-
            cflags: "-O2"

          - name: linux-mipsel
            artifact: 3proxy-linux-mipsel
            tarball: mips32el--uclibc--stable-2024.05-1.tar.xz
            sha256: ae4400a934074a3b1b39fb7ec79fb535da4e65b668f2330ca14576d072f6b13e
            prefix: mipsel-buildroot-linux-uclibc-
            cflags: "-O2"

          - name: linux-ppc
            artifact: 3proxy-linux-ppc
            tarball: powerpc-e500mc--glibc--stable-2024.05-1.tar.xz
            sha256: 365e30fda99630e5bcf04c4913f905640025b90cc9d1a4b17cccfc729827d335
            prefix: powerpc-buildroot-linux-gnu-
            cflags: "-O2"

          - name: linux-ppc64le
            artifact: 3proxy-linux-ppc64le
            tarball: powerpc64le-power8--glibc--stable-2024.05-1.tar.xz
            sha256: 8133b74614f880eb8b76730efee77b8fd281c982bfa2791b72c5f836a529530d
            prefix: powerpc64le-buildroot-linux-gnu-
            cflags: "-O2"

          - name: linux-riscv64
            artifact: 3proxy-linux-riscv64
            tarball: riscv64-lp64d--musl--stable-2024.05-1.tar.xz
            sha256: 481c9353467f42d02edf9080954b3c14a75ff7c19ed9e8fbf9cfa67d028587d3
            prefix: riscv64-buildroot-linux-musl-
            cflags: "-O2"

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download and unpack bootlin toolchain
        run: |
          mkdir -p "$HOME/toolchain" /tmp/toolchain
          url="https://github.com/${{ env.TOOLCHAIN_REPO }}/releases/download/${{ env.TOOLCHAIN_TAG }}/${{ matrix.tarball }}"
          dest="/tmp/toolchain/${{ matrix.tarball }}"

          echo "Downloading $url"
          curl -fL --retry 5 --retry-all-errors "$url" -o "$dest"

          echo "${{ matrix.sha256 }}  $dest" | sha256sum --check --status

          tar -xJ -C "$HOME/toolchain" --strip-components=1 -f "$dest"
          rm -rf /tmp/toolchain

          echo "$HOME/toolchain/bin" >> $GITHUB_PATH

      - name: build static binary
        run: |
          cc="${{ matrix.prefix }}gcc"
          strip_tool="${{ matrix.prefix }}strip"

          "$cc" --version

          mkdir -p bin dist
          make -f Makefile.Linux clean || true

          # Stub setns if targeting older uClibc/Linux headers
          cat << 'EOF' >> src/common.c
          #include <errno.h>
          int setns(int fd, int nstype) {
              errno = ENOSYS;
              return -1;
          }
          EOF

          make -f Makefile.Linux \
            CC="$cc" \
            LN="$cc" \
            STATIC=true \
            EXTRA_CFLAGS="${{ matrix.cflags }}" \
            EXTRA_LDFLAGS="-static"

          cp bin/3proxy "dist/${{ matrix.artifact }}"
          "$strip_tool" "dist/${{ matrix.artifact }}" 2>/dev/null || strip "dist/${{ matrix.artifact }}" || true

      - name: inspect binary
        run: |
          file "dist/${{ matrix.artifact }}"

      - name: calculate sha256
        run: |
          cd dist
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    name: create release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: flatten release directory
        run: |
          mkdir -p release-files
          find release \
            -type f \
            -exec cp {} release-files/ \;
          cd release-files
          ls -lah

      - name: generate manifest
        run: |
          cd release-files
          echo '{' > manifest.json
          first=true
          for file in 3proxy-*; do
            case "$file" in
              *.sha256)
                continue
                ;;
            esac
            sha256=$(sha256sum "$file" | awk '{print $1}')
            if [ "$first" = false ]; then
              echo "," >> manifest.json
            fi
            first=false
            printf '  "%s": "%s"' \
              "$file" \
              "$sha256" \
              >> manifest.json
          done
          echo '' >> manifest.json
          echo '}' >> manifest.json
          cat manifest.json

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release-files/*
          generate_release_notes: true
